<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB RED FORCE - NEXUS TERMINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --red-bright: #ff0000;
            --red-glow: rgba(255, 0, 0, 0.6);
            --red-dim: #440000;
            --black-pure: #000000;
            --glass: rgba(5, 5, 5, 0.95);
        }

        /* LOGIN SCREEN STYLES */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a0000 0%, #000000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000;
            font-family: 'Orbitron', sans-serif;
        }

        .login-box {
            border: 2px solid var(--red-bright);
            padding: 40px;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 30px var(--red-dim);
            text-align: center;
            clip-path: polygon(10% 0, 90% 0, 100% 15%, 100% 85%, 90% 100%, 10% 100%, 0 85%, 0 15%);
        }

        .login-box input {
            display: block; width: 280px; padding: 15px; margin: 15px 0;
            background: rgba(255, 0, 0, 0.05); border: 1px solid var(--red-dim);
            color: #0f0; font-family: 'Share Tech Mono', monospace;
            text-align: center; font-size: 18px; outline: none;
        }

        .login-box input:focus { border-color: var(--red-bright); box-shadow: 0 0 10px var(--red-glow); }

        .login-box button {
            width: 100%; padding: 12px; background: var(--red-bright);
            color: white; border: none; cursor: pointer; font-weight: bold;
            letter-spacing: 3px; transition: 0.3s;
        }

        .login-box button:hover { background: white; color: black; }

        /* MAIN TERMINAL STYLES */
        body { 
            margin: 0; height: 100vh; width: 100vw;
            background: var(--black-pure); color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; perspective: 1000px;
        }

        .bg-motion {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(80, 0, 0, 0.2) 0%, transparent 70%),
                        url('https://www.transparenttextures.com/patterns/stardust.png');
            z-index: -1; animation: bgShift 20s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(2deg); }
        }

        .terminal-container {
            width: 90%; max-width: 1000px; height: 700px;
            background: var(--glass); position: relative; z-index: 10;
            clip-path: polygon(5% 0, 95% 0, 100% 7%, 100% 93%, 95% 100%, 5% 100%, 0 93%, 0 7%);
            border: 1px solid var(--red-dim);
            box-shadow: 0 0 100px rgba(255, 0, 0, 0.15), inset 0 0 50px rgba(0, 0, 0, 1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; box-sizing: border-box;
        }

        .sys-title { font-size: 11px; letter-spacing: 8px; color: var(--red-bright); margin-bottom: 10px; text-transform: uppercase; text-align: center; }

        h2 { font-size: 50px; font-weight: 900; margin: 0 0 40px 0; text-transform: uppercase; text-align: center;
             background: linear-gradient(to bottom, #fff 40%, var(--red-bright)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        input#judgeIdInput {
            width: 100%; max-width: 600px; background: rgba(255, 0, 0, 0.05); border: 2px solid var(--red-dim);
            padding: 25px; color: #fff; font-family: 'Share Tech Mono', monospace;
            font-size: 24px; text-align: center; letter-spacing: 5px; outline: none;
        }

        .main-btn {
            margin-top: 30px; width: 100%; max-width: 600px; padding: 20px; background: var(--red-bright); color: #fff;
            border: none; font-family: 'Orbitron', sans-serif; font-weight: 900;
            text-transform: uppercase; letter-spacing: 5px; cursor: pointer;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }

        .results-box { width: 100%; height: 100%; display: none; flex-direction: column; }
        .scroll-wrap { flex: 1; overflow-y: auto; margin-top: 10px; padding: 0 15px; }
        table { width: 100%; border-collapse: collapse; font-family: 'Share Tech Mono', monospace; }
        th { text-align: left; padding: 15px; color: var(--red-bright); border-bottom: 2px solid var(--red-dim); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 18px; }

        .back-btn {
            color: #888; cursor: pointer; font-size: 11px; letter-spacing: 5px; text-transform: uppercase;
            padding: 10px 30px; border: 1px solid transparent; text-align: center; margin-bottom: 20px;
        }
        .back-btn:hover { color: var(--red-bright); border: 1px solid var(--red-dim); }

    </style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="login-overlay">
    <div class="login-box">
        <div class="sys-title">Identity Verification Required</div>
        <h3 style="color: #fff; margin-bottom: 20px;">NEXUS AUTHENTICATION</h3>
        <input type="text" id="user-input" placeholder="USERNAME" spellcheck="false">
        <input type="password" id="pass-input" placeholder="PASSWORD">
        <button onclick="validateLogin()">INITIALIZE LOGIN</button>
        <p id="error-msg" style="color: yellow; font-size: 12px; margin-top: 15px; display: none; font-family: 'Share Tech Mono';">
            ACCESS DENIED: INVALID CREDENTIALS
        </p>
    </div>
</div>

<div class="bg-motion"></div>

<div class="terminal-container">
    <!-- SEARCH AREA -->
    <div id="searchArea" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="sys-title">Secure Connection Established</div>
        <h2>NEXUS CORE</h2>
        <input type="text" id="judgeIdInput" value="552816571">
        <button id="fetchBtn" class="main-btn">INITIALIZE DECRYPT</button>
    </div>

    <!-- RESULTS AREA -->
    <div id="resultsArea" class="results-box">
        <div class="back-btn" id="backBtn">[ RETURN TO THE CORE ]</div>
        <div class="sys-title">Archive Records Retrieved</div>
        <div class="scroll-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>BATTLE_ID</th>
                        <th>TIMESTAMP</th>
                    </tr>
                </thead>
                <tbody id="matchList"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // LOGIN FUNCTION
    function validateLogin() {
        const user = document.getElementById('user-input').value;
        const pass = document.getElementById('pass-input').value;

        // သင်ပြောင်းလဲနိုင်သော Username နှင့် Password
        const CORRECT_USER = "admin@204";
        const CORRECT_PASS = "Cheepay04";

        if (user === CORRECT_USER && pass === CORRECT_PASS) {
            document.getElementById('login-overlay').style.display = 'none';
        } else {
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('pass-input').value = "";
        }
    }

    // API & TERMINAL FUNCTION
    const AUTH_KEY = "990df26384c39e0a25ab8abc924be641";
    const BASE_URL = "https://esportsdata-sg.mobilelegends.com/battlelist/judge";

    const fetchBtn = document.getElementById('fetchBtn');
    const searchArea = document.getElementById('searchArea');
    const resultsArea = document.getElementById('resultsArea');
    const list = document.getElementById('matchList');

    fetchBtn.addEventListener('click', async () => {
        const id = document.getElementById('judgeIdInput').value.trim();
        fetchBtn.innerText = "DECRYPTING...";
        
        try {
            const res = await axios.get(BASE_URL, { params: { authkey: AUTH_KEY, judgeid: id } });
            const data = res.data.result || [];

            if (data.length > 0) {
                list.innerHTML = data.map((m, i) => `
                    <tr>
                        <td style="color:var(--red-dim)">${(i+1)}</td>
                        <td><strong>${m.battleid}</strong></td>
                        <td style="color:#666; font-size:14px;">${m.reporttime}</td>
                    </tr>
                `).join('');
                searchArea.style.display = "none";
                resultsArea.style.display = "flex";
            } else {
                alert("NO RECORDS FOUND");
            }
        } catch (e) { 
            alert("CONNECTION ERROR"); 
        } finally {
            fetchBtn.innerText = "INITIALIZE DECRYPT";
        }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
        searchArea.style.display = "flex";
        resultsArea.style.display = "none";
    });
</script>

</body>
</html>
